<!doctype html><meta charset="utf-8"><pre id="result">Running</pre><script type="module">
try{const {createEngine}=await import('../audio.mjs');const ctx=new OfflineAudioContext(2,22050*8,22050),e=createEngine(ctx,0);e.update({a:110,b:110.5,gain:.12,enclose:0,over:0},0);const generation=e.generation;const initial=e.snapshot(2);e.update({a:110,b:111,gain:.12,enclose:.7,over:2},2);if(e.generation!==generation)throw Error('graph restarted');if(e.snapshot(2).phaseA!==initial.phaseA)throw Error('phase reset');for(let t=2.025;t<8;t+=.025)e.tick(t);const b=await ctx.startRendering();let energy=0,peak=0;const x=b.getChannelData(0);for(const s of x){if(!Number.isFinite(s))throw Error('non-finite audio');energy+=s*s;peak=Math.max(peak,Math.abs(s));}if(energy<.001||peak>=1)throw Error('invalid output');const windows=[];for(const t of [.5,1,1.5]){let sum=0;for(let i=Math.floor(t*22050);i<Math.floor((t+.08)*22050);i++)sum+=x[i]*x[i];windows.push(sum);}if(Math.max(...windows)<Math.min(...windows)*3)throw Error('pair did not produce beating');window.audioResults={pass:true,energy,peak,windows};e.dispose();}catch(e){window.audioResults={pass:false,error:e.message};}document.getElementById('result').textContent=JSON.stringify(window.audioResults);
</script>
